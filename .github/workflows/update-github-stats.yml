name: Update GitHub Stats in README

on:
  schedule:
    # Runs every Friday at 00:00 UTC
    - cron: '0 0 * * FRI'
  workflow_dispatch: {}

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        env:
          # Prefer a user-provided Personal Access Token for higher rate limits and GraphQL access.
          # If PERSONAL_GITHUB_TOKEN is not set, fall back to the default GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: node ./scripts/update-readme.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update GitHub stats in README [skip ci]" || echo "No changes to commit"
          git push
